<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKE BD Football League | Football Score Tracker</title>
    <style>
        :root {
            --background: #0b0e14;
            --surface: #161b22;
            --surface-hover: #1d2633;
            --border: #30363d;
            --text: #f0f6fc;
            --muted: #8b949e;
            --blue: #1f6feb;
            --green: #238636;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #172235 0, var(--background) 46%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 720px);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #58a6ff;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            line-height: 0.98;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 18px 0 42px;
            color: var(--muted);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .links .row {
            display: grid;
            gap: 14px;
            align-items: stretch;
        }

        .live-row {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .other-row {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .link-card {
            display: flex;
            min-height: 150px;
            padding: 24px;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        .link-card:hover,
        .link-card:focus-visible {
            background: var(--surface-hover);
            border-color: #58a6ff;
            outline: none;
            transform: translateY(-3px);
        }

        .link-card.dashboard {
            border-top: 3px solid var(--blue);
        }

        .link-card.input {
            border-top: 3px solid var(--green);
        }

        .link-card.stats {
            border-top: 3px solid #d29922;
        }

        .link-card.player-stats {
            border-top: 3px solid #7ee787;
        }

        .card-label {
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .card-title {
            margin-top: 12px;
            font-size: 1.45rem;
            font-weight: 800;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
        }

        .arrow {
            align-self: flex-end;
            color: #58a6ff;
            font-size: 1.5rem;
        }

        .add-match-button {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 46px;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: rgba(108, 108, 59, 0.96);
            color: var(--text);
            font-size: 2.1rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
            z-index: 20;
        }

        .add-match-button:hover,
        .add-match-button:focus-visible {
            border-color: #58a6ff;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(16, 118, 255, 0.14);
            outline: none;
        }

        .add-match-menu {
            position: fixed;
            top: 72px;
            right: 18px;
            width: min(420px, calc(100vw - 32px));
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(22, 27, 34, 0.98);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
            z-index: 21;
            display: none;
        }

        .add-match-menu.visible {
            display: block;
        }

        .add-match-menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add-match-menu-item {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(22, 27, 34, 0.96), rgba(13, 17, 23, 0.96));
            color: var(--text);
            font-size: 0.98rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        .add-match-menu-item:hover,
        .add-match-menu-item:focus-visible {
            background: linear-gradient(180deg, rgba(31, 111, 235, 0.14), rgba(31, 111, 235, 0.04));
            border-color: #58a6ff;
            transform: translateY(-1px);
            outline: none;
        }

        .add-match-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vs-label {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-align: center;
        }

        label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.96rem;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .submit-button {
            border: 1px solid #58a6ff;
            background: rgba(31, 111, 235, 0.18);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-match-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .menu-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .menu-icon svg {
            display: block;
        }

        .menu-match .menu-icon {
            color: #1f6feb;
            background: rgba(31, 111, 235, 0.18);
        }

        .menu-tournament .menu-icon {
            color: #2ea043;
            background: rgba(46, 160, 67, 0.18);
        }

        .menu-league .menu-icon {
            color: #d29922;
            background: rgba(210, 153, 34, 0.18);
        }

        .add-match-menu-item:hover .menu-icon,
        .add-match-menu-item:focus-visible .menu-icon {
            filter: brightness(1.08);
        }

        .add-match-menu-item:hover,
        .add-match-menu-item:focus-visible {
            background: var(--surface-hover);
            outline: none;
        }

        @media (max-width: 560px) {
            body {
                padding: 20px 16px;
            }

            .subtitle {
                margin-bottom: 30px;
                font-size: 0.9rem;
            }

            .live-row,
            .other-row {
                grid-template-columns: 1fr;
            }

            .link-card {
                min-height: 110px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <button class="add-match-button" type="button" aria-label="Add a completed Match"
        title="Add a Match/Tournament/League">+</button>
    <div class="add-match-menu" id="addMatchMenu" aria-label="Add match menu">
        <div class="add-match-menu-list">
            <a class="add-match-menu-item menu-match" href="matchForm.html">
                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 2.75L18.5 5.2V11.2C18.5 15.8 15.55 19.88 12 21.25C8.45 19.88 5.5 15.8 5.5 11.2V5.2L12 2.75Z" />
                    </svg>
                </span>
                <span>Create Match</span>
            </a>
            <button class="add-match-menu-item menu-tournament" type="button">
                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 2.75L18.5 5.2V11.2C18.5 15.8 15.55 19.88 12 21.25C8.45 19.88 5.5 15.8 5.5 11.2V5.2L12 2.75Z" />
                    </svg>
                </span>
                <span>Create Tournament</span>
            </button>
            <button class="add-match-menu-item menu-league" type="button">
                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 2.75L18.5 5.2V11.2C18.5 15.8 15.55 19.88 12 21.25C8.45 19.88 5.5 15.8 5.5 11.2V5.2L12 2.75Z" />
                    </svg>
                </span>
                <span>Create League</span>
            </button>
        </div>
    </div>
    <main>
        <p class="eyebrow">MKE BD Football League</p>
        <h1>Football</h1>
        <p class="subtitle">Score Tracker</p>

        <div class="links" aria-label="Score tracker pages">
            <div class="row live-row">
                <button class="link-card dashboard" type="button" onclick="location.href='dashboard.html'">
                    <span>
                        <span class="card-label">View</span>
                        <br>
                        <span class="card-title">Live Dashboard</span>
                    </span>
                    <span class="arrow" aria-hidden="true">&#8594;</span>
                </button>
                <button class="link-card input" type="button" onclick="location.href='input.html'">
                    <span>
                        <span class="card-label">Manage</span>
                        <br>
                        <span class="card-title">Live Input</span>
                    </span>
                    <span class="arrow" aria-hidden="true">&#8594;</span>
                </button>
            </div>

            <div class="row other-row">
                <button class="link-card dashboard" type="button" onclick="location.href='incomplete-matches.html'">
                    <span>
                        <span class="card-label">View</span>
                        <br>
                        <span class="card-title">Incomplete Matches</span>
                    </span>
                    <span class="arrow" aria-hidden="true">&#8594;</span>
                </button>
                <button class="link-card stats" type="button" onclick="location.href='stats.html'">
                    <span>
                        <span class="card-label">Review</span>
                        <br>
                        <span class="card-title">Match Stats</span>
                    </span>
                    <span class="arrow" aria-hidden="true">&#8594;</span>
                </button>
                <button class="link-card player-stats" type="button" onclick="location.href='player-stats.html'">
                    <span>
                        <span class="card-label">Players</span>
                        <br>
                        <span class="card-title">Player Stats</span>
                    </span>
                    <span class="arrow" aria-hidden="true">&#8594;</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const addMatchButton = document.querySelector('.add-match-button');
        const addMatchMenu = document.getElementById('addMatchMenu');
        const addMatchForm = document.querySelector('.add-match-form');

        if (addMatchButton && addMatchMenu) {
            addMatchButton.addEventListener('click', (event) => {
                event.stopPropagation();
                addMatchMenu.classList.toggle('visible');
            });

            document.addEventListener('click', (event) => {
                if (!addMatchButton.contains(event.target) && !addMatchMenu.contains(event.target)) {
                    addMatchMenu.classList.remove('visible');
                }
            });
        }

        if (addMatchForm) {
            addMatchForm.addEventListener('submit', (event) => {
                event.preventDefault();
                addMatchMenu.classList.remove('visible');
            });
        }
    </script>
</body>

</html>
